<!DOCTYPE html>
<html>
<head>
  <title>VM Control Panel</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }
    #screen {
      width: 90%;
      height: 600px;
      border: 2px solid #333;
      margin-top: 20px;
    }
    button {
      margin: 5px;
      padding: 10px;
    }
  </style>
</head>
<body>

<h1>QEMU VM Console</h1>

<button onclick="startVM()">Start</button>
<button onclick="stopVM()">Stop</button>

<div id="screen"></div>

<script src="https://cdn.jsdelivr.net/npm/@novnc/novnc/core/rfb.js"></script>

<script>
let rfb = null

function connect() {
  const url = `ws://${location.host}/vnc`

  rfb = new RFB(document.getElementById("screen"), url, {
    credentials: {}
  })

  rfb.scaleViewport = true
  rfb.resizeSession = true
}

async function startVM() {
  await fetch("/api/start")
  connect()
}

async function stopVM() {
  await fetch("/api/stop")
  if (rfb) rfb.disconnect()
}

connect()
</script>

</body>
</html>
